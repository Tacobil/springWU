<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.css">
	<title></title>
</head>

<body>
	<nav class="menu">
        <button class="menu-button">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <ul>
            <li>
                <a class="menu-list-item" href="index.html">
                    <span class="material-symbols-outlined">home</span>
                    <p>Home</p>
                </a>
            </li>
            <li>
                <a class="menu-list-item" href="">
                    <span class="material-symbols-outlined">history</span>
                    <p>History</p>
                </a>
            </li>
            <li>
                <a class="menu-list-item" href="settings.html">
                    <span class="material-symbols-outlined">settings</span>
                    <p>Settings</p>
                </a>
            </li>
            <li>
                <a class="menu-list-item" href="">
                    <span class="material-symbols-outlined">logout</span>
                    <p>Log Out</p>
                </a>
            </li>
        </ul>
    </nav>
    <div class="fade-layer"></div>

	<header>
		<button class="menu-button">
			<span class="material-symbols-outlined">menu</span>
		</button>
		<a href="index.html" class="logo-link">
			<img alt="logo" src="img/logo.png" style="max-width: 50px">
			<h1>MyTube</h1>
		</a>
		
		<button class="search-button">
			<span class="material-symbols-outlined search">search</span>
		</button>
	</header>

	<div id="wrapper-video" class="wrapper">
		<div id="video-container">
			<iframe class="video-template" width="100%" height="100%" src=""></iframe>
		</div>

        <div id="video-info">
            <h1 id="video-title"></h1>
            <p id="video-publisher"></p>
            <p id="video-description"></p>
            <p id="video-views"></p>
            <p id="video-date"></p>
        </div>
        

		
		<div id="comment-section">
			<h1>Comments</h1>

			<input type="text" value="">
			<input type="submit" value="Send">

			<div class="comment">
				<h2 class="user"></h2>
                <p class="comment-text"></p>
			</div>
		</div>
        
	</div>
</body>
    <script src="js/video.js"></script>
</html>
