<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="wrapper-channel" class="wrapper">
        <!-- Top Navbar -->
        <nav class="flex-div">
            <div class="nav-left flex-div">
                <img src="img/icons/menu.svg" class="icon menu-button">
                <a href="index.html" class="flex-div">
                    <img src="img/logo.png" style="max-height: 30px">
                    <h1 class="logo-text">MyTube</h1>
                </a>
            </div>
            <div class="nav-center flex-div">
                <div class="searchbar flex-div">
                    <input type="search" placeholder="Search">
                    <a href="" class="flex-div"><img src="img/icons/search.svg" class="icon"></a>
                </div>
            </div>

            <div class="nav-right flex-div">
                <a href=""><img src="img/icons/notifications.svg" class="icon"></a>
                <a href=""><img src="img/users/octopus.jpg" class="user-icon"></a>
            </div>
        </nav>

        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="shortcut-links">
                <a href="index.html" class="flex-div"><img src="img/icons/home.svg" class="icon">
                    <p>Home</p>
                </a>
                <a href="" class="flex-div"><img src="img/icons/explore.svg" class="icon">
                    <p>Explore</p>
                </a>
                <a href="" class="flex-div"><img src="img/icons/premium.svg" class="icon">
                    <p>Premium</p>
                </a>
                <a href="" class="flex-div"><img src="img/icons/subscriptions.svg" class="icon">
                    <p>Subscriptions</p>
                </a>
                <a href="" class="flex-div"><img src="img/icons/history.svg" class="icon">
                    <p>History</p>
                </a>
                <a href="" class="flex-div"><img src="img/icons/playlist.svg" class="icon">
                    <p>Playlist</p>
                </a>
                <a href="" class="flex-div"><img src="img/icons/arrow-down.svg" class="icon">
                    <p>Show More</p>
                </a>
            </div>

            <hr>

            <div class="subscriptions">
                <b>Subscriptions</b>
                <a href="" class="flex-div"><img src="img/users/cool-cat.jpg" class="user-icon">
                    <p>Cool Cat</p>
                </a>
                <a href="" class="flex-div"><img src="img/users/christian-buehner.jpg" class="user-icon">
                    <p>Christian Buehner</p>
                </a>
                <a href="" class="flex-div"><img src="img/users/grandma.jpg" class="user-icon">
                    <p>The Internet Grandma</p>
                </a>
                <a href="" class="flex-div"><img src="img/users/ian-dooley.jpg" class="user-icon">
                    <p>Ian Dooley</p>
                </a>
                <a href="" class="flex-div"><img src="img/users/kelly-sikkema.jpg" class="user-icon">
                    <p>Kelly Sikkema</p>
                </a>
            </div>
        </aside>


        <div class="fade-layer"></div>

        <!-- Main Content -->
        <main>
            <div class="channel-top">
                <img class="banner" src="img/banner.jpg">
                <div class="info">
                    <img class="user-icon" src="img/users/cool-cat.jpg">
                    <h2 class="title">Cool Cat</h2>
                    <p class="subtext">The coolest cat in town.</p>
                    <button class="button">Subscribe</button>
                </div>
            </div>


            <div class="channel-feed">
                <div class="sorting">
                    <button>Recent</button>
                    <button>Popular</button>
                    <button>Oldest</button>
                </div>

                <div class="video-feed-container">
                    <div>
                        <a href="video.html"><img src="img/thumbnails/pyramid.jpg" class="thumbnail"></a>
                        <div class="info">
                            <a style="grid-area: user" href="channel.html"><img src="img/users/christian-buehner.jpg" class="user-icon"></a>
                            <h2 style="grid-area: title"><a href="video.html" class="title">Okay, But How Were the Pyramids Built?</a></h2>
                            <p class="subtext">Christian Buehner - 32 259 views - uploaded 2025-03-02</p>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/feed.js"></script>

</body>

</html>
