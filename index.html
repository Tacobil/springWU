<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>MyTube | Homepage</title>
</head>

<body>
    <div id="wrapper-index" class="wrapper">
        <!-- Top Navbar -->
        <nav class="flex-div">
            <div class="nav-left flex-div">
                <img src="img/icons/menu.svg" class="icon menu-button">
                <a href="index.html" class="flex-div">
                    <img src="img/logo.png" style="max-height: 30px">
                    <h1 class="logo-text">MyTube</h1>
                </a>
            </div>
            <div class="nav-center flex-div">
                <div class="searchbar flex-div">
                    <input type="search" placeholder="Search">
                    <a href="" class="flex-div"><img src="img/icons/search.svg" class="icon"></a>
                </div>
            </div>

            <div class="nav-right flex-div">
                <a href=""><img src="img/icons/notifications.svg" class="icon"></a>
                <a href=""><img src="img/users/octopus.jpg" class="user-icon"></a>
            </div>
        </nav>

        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="shortcut-links">
                <a href="index.html" class="flex-div"><img src="img/icons/home.svg" class="icon"><p>Home</p></a>
                <a href="" class="flex-div"><img src="img/icons/explore.svg" class="icon"><p>Explore</p></a>
                <a href="" class="flex-div"><img src="img/icons/premium.svg" class="icon"><p>Premium</p></a>
                <a href="" class="flex-div"><img src="img/icons/subscriptions.svg" class="icon"><p>Subscriptions</p></a>
                <a href="" class="flex-div"><img src="img/icons/history.svg" class="icon"><p>History</p></a>
                <a href="" class="flex-div"><img src="img/icons/playlist.svg" class="icon"><p>Playlist</p></a>
                <a href="" class="flex-div"><img src="img/icons/arrow-down.svg" class="icon"><p>Show More</p></a>
            </div>
            
            <hr>

            <div class="subscriptions">
                <b>Subscriptions</b>
                <a href="" class="flex-div"><img src="img/users/cool-cat.jpg" class="user-icon"><p>Cool Cat</p></a>
                <a href="" class="flex-div"><img src="img/users/christian-buehner.jpg" class="user-icon"><p>Christian Buehner</p></a>
                <a href="" class="flex-div"><img src="img/users/grandma.jpg" class="user-icon"><p>The Internet Grandma</p></a>
                <a href="" class="flex-div"><img src="img/users/ian-dooley.jpg" class="user-icon"><p>Ian Dooley</p></a>
                <a href="" class="flex-div"><img src="img/users/kelly-sikkema.jpg" class="user-icon"><p>Kelly Sikkema</p></a>
            </div>

        </aside>
        
        <div class="fade-layer"></div>

        <!-- Main Content -->
        <main class="video-feed-container">
            <div>
                <a href="video.html"><img src="img/thumbnails/pyramid.jpg" class="thumbnail"></a>
                <div class="video-info">
                    <a href="channel.html" style="grid-area:user"><img src="img/users/christian-buehner.jpg" class="user-icon"></a>
                    <a href="video.html" style="grid-area:title"><h2 class="video-title">Okay, But How Were the Pyramids Built?</h2></a>
                    <p style="grid-area:subtext;" class="video-subtext">Christian Buehner - 32 259 views - uploaded 2025-03-02</p>
                </div>
            </div>
        </main>

    </div>

    <script src="js/index.js"></script>
</body>

</html>
